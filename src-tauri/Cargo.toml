[package]
name = "llm-workflow"
version = "0.1.21"
description = "A local-first workspace for human-approved LLM workflows."
authors = ["LLM Workflow contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "llm_workflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# 등록된 launchd 서비스의 `Label`을 읽는다(SPEC-036 TASK-122). 손으로 XML을 훑지 않는 이유는
# 데몬이 `plistlib`으로 읽는 값과 갈리면 앱이 엉뚱한 서비스를 대상으로 삼기 때문이고, 바이너리
# plist는 텍스트 훑기로 아예 읽히지 않기 때문이다. 플랫폼 갈래를 두지 않는 것은 macOS 전용
# 의존성으로 두면 파싱 코드가 다른 플랫폼의 clippy에서 검사되지 않기 때문이다.
plist = "1"
thiserror = "2"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
notify = "8"
# 게시된 런타임 릴리스를 조회·내려받는 자리(agent_runtime_release)에서만 쓴다. rustls를 쓰는
# 것은 세 OS의 시스템 TLS 스택 차이를 빌드에서 지우기 위해서다.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[dev-dependencies]
pretty_assertions = "1"
